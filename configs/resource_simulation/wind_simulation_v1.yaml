site:
  latitude: 41.0
  longitude: 113.13

run:
  target_year: 2023
  refresh_mode: regenerate

paths:
  output: data/profit_calc/wind_pv_bess/v1/wind_power.csv

wind_simulation:
  year: 2023
  freq: 5min

  farm_capacity_mw: 80

  mean_wind_speed_target: 5.5
  target_full_load_hours: 1900.0

  meteo_height_m: 100.0
  met_mast_height_m: 140.0
  hub_height_m: 140.0
  shear_alpha: 0.2

  rated_power_kw: 5000.0
  cut_in: 3.0
  rated_speed: 11.0
  cut_out: 25.0

  max_power_ratio: 1.2

  mode: resource_simulation
