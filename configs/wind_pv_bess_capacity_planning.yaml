# Wind+PV+BESS 容量规划配置

# 场景参数
scenario:
  latitude: 28.42
  longitude: 117.88
  timezone: "Asia/Shanghai"
  n_hours: 8760
  solar_equiv_hours: 1100.0
  wind_equiv_hours: 1920.0
  load_mean_kw: 78000.0

# 容量规划约束
constraints:
  self_use_ratio_min: 0.60       # 新能源自消纳率 ≥ 60%
  load_cover_ratio_min: 0.30     # 负荷覆盖率 ≥ 30%

# 储能参数
bess:
  eta_roundtrip: 0.92
  c_rate: 0.5
  soc_init_frac: 0.50
  soc_min_frac: 0.10
  soc_max_frac: 1.00

# 成本参数
cost:
  pv_capex_yuan_per_kwp: 2000
  bess_capex_yuan_per_kwh: 1000

# PV 搜索参数
pv_search:
  pv_step_coarse_kwp: 2000.0
  pv_step_fine_kwp: 250.0
  pv_refine_window_kwp: 8000.0
  pv_min_kwp: 0.0

# BESS 搜索参数
bess_search:
  enable_bess: true
  batt_hi_init_kwh: 500.0
  batt_hi_max_kwh: 10000000.0
  batt_bisect_iter: 26
  batt_tol_kwh: 1.0

# 能量门槛检查
gate_check:
  enable: true
  target_ratio: 0.30

# 充放切换间隔
switch_gap_hours: 0.0

# 装机容量
capacity:
  wind_farm_mw: 110.0
  pv_kwp: 28250
