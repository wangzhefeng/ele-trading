# IRR 目标型 Wind+PV+BESS 容量规划配置

scenario:
  timezone: "Asia/Shanghai"

site:
  latitude: 41.0
  longitude: 113.13

pv_simulation:
  latitude: 41.0
  longitude: 113.13
  timezone: Asia/Shanghai
  capacity_kwp: 1.0
  tilt: null
  azimuth: 180.0
  system_loss: 0.20
  temp_coeff: -0.004
  cloud_factor: 0.75
  mode: clear_sky

wind_simulation:
  year: 2023
  freq: 5min
  farm_capacity_mw: 1.0
  mean_wind_speed_target: 5.5
  target_full_load_hours: 1900.0
  meteo_height_m: 100.0
  met_mast_height_m: 140.0
  hub_height_m: 140.0
  shear_alpha: 0.2
  rated_power_kw: 5000.0
  cut_in: 3.0
  rated_speed: 11.0
  cut_out: 25.0
  max_power_ratio: 1.2
  mode: resource_simulation

price:
  target_owner_price_yuan_per_kwh: 0.32
  grid_buy_price_yuan_per_kwh: 0.36
  green_price_adder_yuan_per_kwh: 0.074
  target_irr: 0.08
  irr_tolerance: 0.002

constraints:
  self_use_ratio_min: 0.60
  load_cover_ratio_min: 0.35

capacity:
  wind_max_mw: 280.0
  pv_max_mw: 140.0
  bess_max_mwh: 1000.0

search:
  wind_step_mw: 10.0
  pv_step_mw: 10.0
  bess_step_mwh: 10.0

bess:
  eta_roundtrip: 0.92
  c_rate: 0.5
  soc_init_frac: 0.50
  soc_min_frac: 0.10
  soc_max_frac: 1.00
  switch_gap_hours: 0.0

cost:
  wind_capex_yuan_per_kw: 5000.0
  pv_capex_yuan_per_kwp: 3500.0
  bess_capex_yuan_per_kwh: 1500.0
  annual_opex_ratio: 0.02
  life_years: 15
