data:
  bridge_config_path: configs/wind_pv_es_calc_data_bridge.yaml
  refresh_before_run: false
  df_2025_path: data/wind_pv_es_calc/temp/df_2025.csv
  df_pv_2025_path: data/wind_pv_es_calc/temp/df_pv_2025.csv
  df_wind_2025_path: data/wind_pv_es_calc/temp/df_wind_2025.csv
  start_time: "2025-01-01 00:00:00"
  periods: 96

dispatch:
  step_hours: 0.25
  demand_charge_rate: 35.0
  terminal_soc_target: 500.0
  cycle_cost_rate: 0.02

bess:
  capacity: 1200.0
  soc_min: 100.0
  soc_max: 1200.0
  p_ch_max: 400.0
  p_dis_max: 400.0
  eta_ch: 0.95
  eta_dis: 0.95
  initial_soc: 500.0

export:
  allow_export: true
  sell_price: 0.32
  export_limit: null
  curtailment_cost_rate: 0.0

policy:
  charge_allowed_hours: null
  discharge_allowed_hours: null
  pv_to_bess_reward_rate: 0.0
  pv_to_load_reward_rate: 0.0
  pv_export_penalty_rate: 0.0

price:
  mode: synthetic
  price_csv_path: null
  time_col: Time
  price_col: buy_price
  valley_price: 0.28
  flat_price: 0.62
  peak_price: 1.05
  price_type_periods:
    - type: valley
      start_hour: 0
      end_hour: 7
    - type: flat
      start_hour: 7
      end_hour: 17
    - type: peak
      start_hour: 17
      end_hour: 22
    - type: flat
      start_hour: 22
      end_hour: 24

output:
  write_dispatch_csv: false
  dispatch_result_path: results/wind_pv_legacy_market_trading.csv
