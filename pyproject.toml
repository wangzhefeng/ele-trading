[build-system]
requires = [
    "setuptools>=65",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ele-trading"
version = "0.1.0"
description = "电力交易算法研究型原型项目"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pulp>=3.3.0",
    "pyomo>=6.10.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
