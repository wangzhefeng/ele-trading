scenario:
  # 场景名称：v1 容量搜索演示。
  name: v1_capacity_search_demo

sample_data:
  # 是否运行前生成模拟 CSV；true 表示复用 data_provider 的样例数据。
  enabled: true
  # 模拟数据年份。
  year: 2026
  # 模拟数据时间频率。
  freq: 1h

paths:
  # 负荷输入 CSV。
  load_csv: dataset/sample_load.csv
  # 电价输入 CSV。
  price_csv: dataset/sample_price.csv
  # 风光资源输入 CSV。
  resource_csv: dataset/sample_resource.csv
  # 单场景月度结算输出 CSV。
  monthly_output_csv: results/v1_mvp_monthly_settlement.csv
  # 单场景时序调度输出 CSV。
  dispatch_output_csv: results/v1_mvp_dispatch_timeseries.csv
  # v1 候选方案搜索结果输出 CSV。
  candidate_output_csv: results/v1_candidate_results.csv
  # v1 最优可行方案摘要输出 CSV。
  best_summary_csv: results/v1_best_summary.csv
  # v1 不可行方案原因输出 CSV。
  infeasible_reasons_csv: results/v1_infeasible_reasons.csv
  # v1 最优方案年度现金流输出 CSV。
  annual_cashflows_csv: results/v1_annual_cashflows.csv

project:
  # 基准风电装机容量，单位 kW；搜索时资源曲线按候选容量相对该值缩放。
  wind_capacity_kw: 1000.0
  # 基准光伏装机容量，单位 kW；搜索时资源曲线按候选容量相对该值缩放。
  pv_capacity_kw: 800.0
  # 默认固定 PPA 单价，容量搜索会用 search.ppa_price 覆盖。
  ppa_price: 0.55
  # 余电上网价格，单位元/kWh。
  export_price: 0.28
  # 目标税前项目 IRR。
  target_irr: 0.08
  # 电价单位说明。
  price_unit: CNY_per_kWh

bess:
  # 基准储能功率，单位 kW；容量搜索会用 search.bess_power_kw 覆盖。
  power_kw: 500.0
  # 基准储能容量，单位 kWh；容量搜索会用 search.bess_energy_kwh 覆盖。
  energy_kwh: 1000.0
  # 充电效率。
  charge_efficiency: 0.95
  # 放电效率。
  discharge_efficiency: 0.95
  # 最小 SOC 比例。
  soc_min_pct: 0.1
  # 最大 SOC 比例。
  soc_max_pct: 0.9
  # 初始 SOC 比例。
  initial_soc_pct: 0.5
  # 是否允许电网充电。
  allow_grid_charge: true
  # 允许充电的 price_type。
  charge_price_types:
    - valley
    - flat
  # 允许放电的 price_type。
  discharge_price_types:
    - peak
    - 尖峰
    - 高峰

settlement:
  # 每月固定基本电费模拟值，单位元/月。
  basic_charge_per_month: 1000.0
  # 需量电费模拟值，单位元/kW/月。
  demand_charge_per_kw_month: 20.0
  # 输配电价附加模拟值，单位元/kWh。
  transmission_price_adder: 0.0
  # 偏差考核模拟值，单位元/kWh。
  deviation_penalty_per_kwh: 0.0

finance:
  # 项目测算年限，单位年。
  project_years: 20
  # 风电单位投资，单位元/kW。
  capex_wind_per_kw: 5500.0
  # 光伏单位投资，单位元/kW。
  capex_pv_per_kw: 3500.0
  # 储能功率侧单位投资，单位元/kW。
  capex_bess_power_per_kw: 500.0
  # 储能容量侧单位投资，单位元/kWh。
  capex_bess_energy_per_kwh: 900.0
  # 固定运维费比例。
  fixed_om_pct_of_capex: 0.02
  # 可再生发电年衰减率。
  renewable_degradation_pct: 0.005
  # 储能更换年份。
  bess_replacement_year: 10
  # 储能更换成本比例。
  bess_replacement_cost_pct: 0.35

search:
  # 是否启用 v1 容量搜索。
  enabled: true
  # 风电容量候选值，单位 kW。
  wind_capacity_kw:
    - 800.0
    - 1000.0
  # 光伏容量候选值，单位 kW。
  pv_capacity_kw:
    - 600.0
    - 800.0
  # 储能功率候选值，单位 kW。
  bess_power_kw:
    - 300.0
    - 500.0
  # 储能容量候选值，单位 kWh。
  bess_energy_kwh:
    - 600.0
    - 1000.0
  # 固定 PPA 单价候选值，单位元/kWh。
  ppa_price:
    - 0.45
    - 0.55
  # 投资方最低税前项目 IRR。
  min_project_irr: 0.08
  # 业主最低节费比例。
  min_owner_saving_pct: 0.05
  # 最低自发自用比例；null 表示不启用该约束。
  min_self_use_ratio:
  # 最大余电上网比例；null 表示不启用该约束。
  max_export_ratio:
