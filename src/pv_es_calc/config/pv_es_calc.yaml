data:
  data_dir: data/profit_calc/pv_es
  demand_file: demand_load.csv
  pv_file: pv_load.csv
  price_file: ele_price.csv
  time_col: time
  value_col: value
  price_type_col: type
  encoding: utf-8-sig

run:
  start_time: "2025-01-01 00:00:00"
  end_time: "2025-01-03 00:00:00"
  freq_minutes: 15
  method_version: v4
  es_scale_list: [0, 100]
  max_workers: 1
  output_dir: data/profit_calc/pv_es
  strategy_dir: es_scale_experiment_optim

storage:
  usable_depth: 0.90
  charge_loss: 0.92
  discharge_loss: 0.95
  transform_capacity: 1600
  capacity_hours: 2.0
  initial_soc: 0.0
  es_capacity_min: 0.0

market:
  max_demand_price: 33.8
  pv_sell_price: 0.319438

objective:
  smooth_penalty_weight: 0.0001
  discharge_priority_weight: 0.000001
  charge_target_penalty_weight: 10.0
  discharge_target_penalty_weight: 10.0

version_methods:
  v1:
    dispatch_mode: lp
    noon_pv_to_battery_priority_weight: 0.0
    noon_pv_to_load_priority_weight: 0.0
    noon_pv_to_grid_priority_weight: 0.0
    noon_grid_to_battery_penalty_weight: 0.0
    noon_pv_to_grid_penalty_weight: 0.0
  v2:
    dispatch_mode: lp
    noon_pv_to_battery_priority_weight: 10.0
    noon_pv_to_load_priority_weight: 0.0
    noon_pv_to_grid_priority_weight: 0.0
    noon_grid_to_battery_penalty_weight: 0.0
    noon_pv_to_grid_penalty_weight: 0.0
  v3:
    dispatch_mode: lp
    noon_pv_to_battery_priority_weight: 0.0
    noon_pv_to_load_priority_weight: 10.0
    noon_pv_to_grid_priority_weight: 0.0
    noon_grid_to_battery_penalty_weight: 0.0
    noon_pv_to_grid_penalty_weight: 0.0
  v4:
    dispatch_mode: lp
    noon_pv_to_battery_priority_weight: 0.0
    noon_pv_to_load_priority_weight: 0.0
    noon_pv_to_grid_priority_weight: 0.0
    noon_grid_to_battery_penalty_weight: 0.0
    noon_pv_to_grid_penalty_weight: 10.0
  v5:
    dispatch_mode: rule
    noon_pv_to_battery_priority_weight: 0.0
    noon_pv_to_load_priority_weight: 0.0
    noon_pv_to_grid_priority_weight: 0.0
    noon_grid_to_battery_penalty_weight: 0.0
    noon_pv_to_grid_penalty_weight: 0.0

plot:
  enabled: false
  start_time: "2025-01-01 00:00:00"
  end_time: "2025-01-02 23:45:00"
  output_dir: data/profit_calc/pv_es/plots
